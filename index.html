<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login/login.css">
    <link rel="icon" type="image/svg+xml" href="interface/assets/project-icon.svg">
</head>
<body>

<div class="login_card">
    <img class="logo_box project_logo" src="interface/assets/project-icon.svg" alt="Odiongan reporting logo">
    <p class="system_title">Odiongan Municipal Reporting</p>
    <p class="subtitle">Log into your account</p>

    <form id="loginForm">
        <div class="input_group">
            <input type="email" id="email" name="email" placeholder="Email@gmail.com" autocomplete="email" required>
        </div>

        <div class="input_group">
            <input type="password" id="password" name="password" class="password-input" placeholder="Password" autocomplete="current-password" required>

            <button
                type="button" class="toggle_password" id="togglePassword">
                <img src="assets_log/hides.png" id="eyeIcon" alt="Toggle Password">
            </button>
       
        </div>
        <div class="remember_panel">
            <label class="remember_device" for="rememberDevice">
                <input id="rememberDevice" type="checkbox" aria-describedby="rememberHint">
                <span>Keep me signed in</span>
            </label>
            <p id="rememberHint" class="remember_hint">Use only on your own phone or computer.</p>
        </div>
        <button type="submit" class="signin_btn">Sign In</button>
    </form>

    <p id="loginFeedback" class="login_feedback" role="alert" aria-live="polite" hidden></p>

    <details class="password_reset" id="passwordReset">
        <summary>Forgot password?</summary>
        <form id="passwordResetForm">
            <p>Enter your account email to request a password reset link.</p>
            <div class="input_group">
                <label for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" autocomplete="email" maxlength="254" required>
            </div>
            <button type="submit" id="resetSubmit">Send reset email</button>
            <p id="resetMessage" role="status" aria-live="polite" hidden></p>
        </form>
    </details>
    <div class="footer_text">New resident? <a href="register.html">Create account</a></div>
</div>

<script type="module" src="login/login.js"></script>
<script type="module" src="login/password-reset.js"></script>
</body>
</html>
