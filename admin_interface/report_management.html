<!DOCTYPE html>
<html lang="en">
<head>
        <script>
            if (/^\/admin(?:\/|$)/.test(location.pathname)) {
                const base = document.createElement('base');
                base.href = '/admin_interface/';
                document.head.append(base);
            }
        </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_admin.css">
    <title>Report management</title>
</head>
<body data-report-page>

    <header class="dashboard_header">    
        <div class="header_logo_placeholder"><img src="../interface/assets/app-192.png" alt="" class="brand_icon"></div>
                <div class="header_title_block">
                    <h1>Odiongan Municipal Reporting</h1>
                    <p>Odiongan, Romblon</p>
                </div>
    </header>

    <section class="side_bar">
        <div class="nav_nemu">
            <a href="dashboard.html" class="center_icon">
                <img src="assets_admin/home (2).png" alt="icon" class="nav_icon" >
                <p  class="nav_icon" >Dashboard</p>
            </a>

            <a href="report_management.html" class="center_icon active" >
                <img src="assets_admin/document (1).png" alt="icon" class="nav_icon" >
                <p class="nav_icon active_color" >Report management</p>
            </a>

            <a href="analytics.html" class="center_icon" >
                <img src="assets_admin/data-management (1).png" alt="icon" class="nav_icon">
                <p class="nav_icon" >Analytics</p>
            </a>

            <a href="admin_announcement.html" class="center_icon" >
                <img src="assets_admin/megaphone (1).png" alt="icon" class="nav_icon">
                <p class="nav_icon" >Announcement</p>
            </a>
           
        </div>
        <div class="logout_container">
        <a href="#" class="logout_link" onclick="handleLogout(event)">
            <img src="assets_admin/Picture1.png" alt="Logout Icon" class="logout_icon">
            <span>Log-out</span>
        </a>
    </div>

    </section>
 
<main class="table_of_reports_content">
        <!-- Search Toolbar -->
        <div class="table-toolbar">
            <h1>Reports Management</h1>
            <div class="search-box">
                <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <!-- Tiyaking 'residentSearchInput' ang ID at 'filterReports()' ang function -->
                <input type="text" id="residentSearchInput" class="search-input" placeholder="Search resident name, ID, or category...">
            </div>
        </div>

        <p id="reportsFeedback" role="status"></p><button id="reportsRetry" type="button" hidden>Retry</button>
  <!-- Dynamic Container para sa Cards -->
        <div id="reportsListContainer">

            
        </div>

<div id="reportEditor" class="modal-overlay" hidden>
  <section class="floating-card" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <div class="modal-header"><h2 id="editorTitle">Report details</h2><button id="closeEditor" type="button" class="modal-close" aria-label="Close report">×</button></div>
    <div class="modal-body">
      <div id="editorDetails"></div>
      <div id="editorPhoto"></div>
      <form id="processingForm">
        <label>Status <select id="processingStatus" required></select></label>
        <label>Priority <select id="processingPriority"></select></label>
        <label>Routing level <select id="processingRouting"></select></label>
        <label>Referral destination (optional)<input id="processingReferral" maxlength="200" placeholder="Office, barangay or agency"></label>
        <p>Referral details record manual coordination; saving does not contact or dispatch another office.</p>
        <button type="submit" class="btn_update">Save changes</button>
        <button id="reloadProcessing" type="button">Reload saved values</button>
        <p id="processingFeedback" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</div>
</main>

<script type="module" src="js_dashboardTable/reports_table.js"></script>
<script type="module" src="admin_login/login_as_admin.js"></script>
</body>
</html>
