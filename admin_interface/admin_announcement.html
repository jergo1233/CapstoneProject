<!DOCTYPE html>
<html lang="en">
<head>
        <script>
            if (/^\/admin(?:\/|$)/.test(location.pathname)) {
                const base = document.createElement('base');
                base.href = '/admin_interface/';
                document.head.append(base);
            }
        </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_admin.css">
    <title>Announcement</title>
</head>
<body class="admin_announcements_page">

    <header class="dashboard_header">    
        <div class="header_logo_placeholder"><img src="../interface/assets/app-192.png" alt="" class="brand_icon"></div>
                <div class="header_title_block">
                    <h1>Odiongan Municipal Reporting</h1>
                    <p>Odiongan, Romblon</p>
                </div>
    </header>

    <section class="side_bar">
        <div class="nav_nemu">
            <a href="dashboard.html" class="center_icon">
                <img src="assets_admin/home (2).png" alt="icon" class="nav_icon">
                <p  class="nav_icon" >Dashboard</p>
            </a>

            <a href="report_management.html" class="center_icon" >
                <img src="assets_admin/document.png" alt="icon" class="nav_icon">
                <p class="nav_icon" >Report management</p>
            </a>

            <a href="analytics.html" class="center_icon" >
                <img src="assets_admin/data-management (1).png" alt="icon" class="nav_icon" >
                <p class="nav_icon" >Analytics</p>
            </a>

            <a href="admin_announcement.html" class="center_icon active" >
                <img src="assets_admin/megaphone (2).png" alt="icon" class="nav_icon">
                <p class="nav_icon active_color" >Announcement</p>
            </a>
            
        </div>
           <div class="logout_container">
        <a href="#" class="logout_link" onclick="handleLogout(event)">
            <img src="assets_admin/Picture1.png" alt="Logout Icon" class="logout_icon">
            <span>Log-out</span>
        </a>
    </div>
    
    </section>



    <!-- Main Content Area -->
    <main class="main_content">
        <div class="announcement_top_bar">
            <h2>Announcement History</h2>
            <button class="btn_create_announcement" id="openModalBtn" disabled>Create Announcement</button>
            
        </div>
        <p id="announcementFeedback" role="status"></p><button id="announcementRetry" type="button">Refresh announcements</button>
        <!-- Announcement Cards Container -->
        <div class="announcement_grid" id="announcementsList">


        </div>
    </main>

    <!-- Modal Overlay para sa Create Announcement -->
    <div class="modal-overlay" id="announcementModal">
        <div class="announcement_modal_card" role="dialog" aria-modal="true" aria-labelledby="createAnnouncementHeading">
            <div class="announcement_dialog_heading"><h3 id="createAnnouncementHeading">Create Announcement</h3><button type="button" id="closeAnnouncementBtn" aria-label="Close create announcement">&times;</button></div>
            
            <label for="announcementTitle">Title</label>
            <input type="text" id="announcementTitle" maxlength="200" class="modal_input_field" placeholder="Title">
            <label for="announcementContent">Announcement content</label>
            <textarea id="announcementContent" maxlength="10000" class="modal_textarea_field" placeholder="Write the update residents need to know"></textarea>
            
            <span class="attach_photos_label">Attach one image (JPEG, PNG, WebP; up to 5 MB)</span>
            <div class="photo_actions">
                <!-- Camera Button na may PNG Image -->
                <label for="imageUploadCamera" class="photo_btn">
                    <img src="assets_admin/photo-camera.png" alt="" class="btn_icon_img"> Take photo
                </label>
                <input type="file" id="imageUploadCamera" accept="image/jpeg,image/png,image/webp" capture="environment" style="display: none;">

                <!-- File Folder Button na may PNG Image -->
                <label for="imageUploadFile" class="photo_btn">
                    <img src="assets_admin/image.png" alt="Folder" class="btn_icon_img"> Choose File
                </label>
                <input type="file" id="imageUploadFile" accept="image/jpeg,image/png,image/webp" style="display: none;">
            </div>

            <!-- Preview Container para sa na-upload na images -->
            <div class="photo_previews" id="photoPreviews"></div>

            <p id="announcementFormFeedback" role="status"></p>
            <button type="button" class="btn_post_announcement" id="postAnnouncementBtn">Post Announcement</button>
        </div>
    </div>


    <!-- Modal Overlay para sa pag-view ng Clicked Announcement Details -->
<div class="modal-overlay" id="viewAnnouncementModal">
    <div class="announcement_modal_card view_modal_card" role="dialog" aria-modal="true" aria-labelledby="viewTitle">
        <button type="button" class="btn_close_view_modal" id="closeViewModalBtn" aria-label="Close announcement">&times;</button>
        <h2 id="viewTitle"></h2>
        <p id="viewContent" class="view_content_text"></p>
        <div id="viewImagesContainer" class="view_images_container"></div>
    </div>
</div>

    <!-- Separate JS File para sa Firebase / Mock Data Operations -->
    <script type="module" src="js_dashboardTable/announcements_submit.js"></script>
    <script type="module" src="admin_login/login_as_admin.js"></script>
</body>
</html>
