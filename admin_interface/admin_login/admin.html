<!DOCTYPE html>
<html lang="en">
<head>
        <script>
            if (/^\/admin(?:\/|$)/.test(location.pathname)) {
                const base = document.createElement('base');
                base.href = '/admin_interface/admin_login/';
                document.head.append(base);
            }
        </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login As Admin</title>
    <link rel="stylesheet" href="login_admin.css">
    <link rel="icon" type="image/svg+xml" href="../../interface/assets/project-icon.svg">
</head>
<body>

<div class="login_card">
    <img class="logo_box project_logo" src="../../interface/assets/project-icon.svg" alt="Odiongan reporting logo">
    <p class="system_title">Odiongan Municipal Reporting</p>
    <p class="subtitle">Welcome Back</p>

    <form id="loginForm">
        <div class="input_group">
            <input type="email" id="admin_email" name="admin_email" placeholder="Email@gmail.com" required>
        </div>

        <div class="input_group">
            <input type="password" id="admin_password" class="password_input" placeholder="Password" required>

            <button
                type="button" class="toggle_password" id="togglePassword">
                <img src="../assets_admin/hides.png" id="eyeIcon" alt="Toggle Password">
            </button>
       
        </div>
        <button type="submit" class="signin_btn">Sign In</button>
    </form>

    <details class="password_reset" id="passwordReset">
        <summary>Forgot password?</summary>
        <form id="passwordResetForm">
            <p>Enter your account email to request a password reset link.</p>
            <div class="input_group">
                <label for="resetEmail">Email address</label>
                <input type="email" id="resetEmail" autocomplete="email" maxlength="254" required>
            </div>
            <button type="submit" id="resetSubmit">Send reset email</button>
            <p id="resetMessage" role="status" aria-live="polite" hidden></p>
        </form>
    </details>
    <div class="footer_text">Login to your admin account</div>
</div>

<script type="module" src="login_as_admin.js"></script>
<script type="module" src="password-reset.js"></script>
</body>
</html>
