<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login As Admin</title>
    <link rel="stylesheet" href="login_admin.css">
</head>
<body>

<div class="login_card">
    <p class="logo_box">LOGO</p>
    <p class="system_title">SYSTEM TITLE</p>
    <p class="subtitle">Welcome Back</p>

    <form id="loginForm">
        <div class="input_group">
            <input type="email" id="admin_email" name="admin_email" placeholder="Email@gmail.com" required>
        </div>

        <div class="input_group">
            <input type="password" id="admin_password" class="password_input" placeholder="Password" required>

            <button
                type="button" class="toggle_password" id="togglePassword">
                <img src="../assets_admin/hides.png" id="eyeIcon" alt="Toggle Password">
            </button>
       
        </div>
        <button type="submit" class="signin_btn">Sign In</button>
    </form>

    <div class="footer_text">Login to your admin account</div>
</div>

<script src="login_as_admin.js"></script>
</body>
</html>
