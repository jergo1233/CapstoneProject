<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipal Gov - Admin</title>
    <link rel="stylesheet" href="style_admin.css">
</head>
<body>

    <header class="dashboard_header">    
        <div class="header_logo_placeholder">Logo</div>
                <div class="header_title_block">
                    <h1>System Title</h1>
                    <p>Odiongan, Romblon</p>
                </div>
    </header>

    <section class="side_bar">
        <div class="nav_nemu">
            <a href="dashboard.html" class="center_icon active">
                <img src="assets_admin/home.png" alt="icon" class="nav_icon">
                <p  class="nav_icon active_color">Dashboard</p>
            </a>

            <a href="report_management.html" class="center_icon" >
                <img src="assets_admin/document.png" alt="icon" class="nav_icon">
                <p class="nav_icon">Report management</p>
            </a>

            <a href="analytics.html" class="center_icon" >
                <img src="assets_admin/data-management (1).png" alt="icon" class="nav_icon">
                <p class="nav_icon" >Analytics</p>
            </a>

            <a href="admin_announcement.html" class="center_icon" >
                <img src="assets_admin/megaphone (1).png" alt="icon" class="nav_icon" >
                <p class="nav_icon" >Announcement</p>
            </a>
       
        </div>
        <div class="logout_container">
        <a href="#" class="logout_link" onclick="handleLogout(event)">
            <img src="assets_admin/Picture1.png" alt="Logout Icon" class="logout_icon">
            <span>Log-out</span>
        </a>
    </div>
    </section>

   <main class="table_of_reports_content">


  <!-- Toolbar / Search Bar -->
  <div class="table-toolbar">
    <h1>Tables of Reports</h1>
    <div class="search-box">
      <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input type="text" id="residentSearchInput" class="search-input" placeholder="Search resident name..." onkeyup="filterReports()">
    </div>
  </div>

  <!-- Main Table -->
  <div class="table-container">
    <table class="pro-table">
      <thead>
        <tr>
          <th>Report ID</th>
          <th>Resident Name</th>
          <th>Category</th>
          <th>Location</th>
          <th>Description</th>
          <th>Date</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="reportsTableBody">
        <!-- Rendered via JavaScript -->
      </tbody>
    </table>
  </div>



  <!-- Floating Modal (Hidden by default) -->
  <div id="descModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="floating-card" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span id="modalReportId" class="modal-title">Report Details</span>
        <button class="modal-close" onclick="closeModalDirect()">&times;</button>
      </div>
      <div id="modalBody" class="modal-body">
        <p id="modalDescription" class="modal-desc-text"></p>
        
        <!-- Attached Images Section -->
        <div class="modal-images-section">
          <h4 class="modal-section-title">Attached Photos</h4>
          <div id="modalImagesGrid" class="modal-images-grid">
            <!-- Dynamically populated via JS -->
          </div>
      </div>
    </div>
  </div>
  </div>
</main>



<script src="js_dashboardTable/reports_table.js"></script>
<script src="admin_login/login_as_admin.js"></script>
</body>
</html>
