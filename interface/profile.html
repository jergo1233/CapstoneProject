<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Municipal Gov - Profile</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="desktop.css">
        <link rel="manifest" href="manifest.webmanifest">
        <meta name="theme-color" content="#1f3d5b">
    <link rel="stylesheet" href="../interface/notifications.css">
    <link rel="icon" type="image/svg+xml" href="assets/project-icon.svg">
</head>
    <body>
        <style>.app_container[hidden], #sessionStatus[hidden] { display: none !important; }</style>
        <div id="sessionStatus" role="status" aria-live="polite" hidden>
            <p id="sessionMessage"></p>
            <button id="sessionRetry" type="button" disabled>Retry</button>
        </div>
        <noscript>JavaScript is required to verify your account.</noscript>
        <div class="app_container" hidden>
            <header class="app_header">
                <div class="app_logo_placeholder"><img src="assets/project-icon.svg" alt="" class="brand_icon"></div>
                <div class="header_title_block">
                    <h1>Odiongan Municipal Reporting</h1>
                    <p>Odiongan, Romblon</p>
                </div>
            </header>




            
            <main class="main_content">
                <div id="profileStatus" role="status" aria-live="polite" hidden>
                    <p id="profileMessage"></p>
                    <button id="profileRetry" type="button">Retry</button>
                </div>
                <div class="profile_card" data-fb-collection="residents" aria-busy="true">
                    <div class="profile_avatar" aria-hidden="true">…</div>
                    <h3 class="profile_name" data-fb-field="fullName">Loading profile…</h3>
                    <p class="profile_email" data-fb-field="emailAddress"></p>
                    <div class="badge-brgy" data-fb-field="homeBarangay"></div>
                </div>
                <div class="profile_actions">
                    <button type="button" class="profile_menu" id="residentLogout" disabled>
                        <span>Log out</span>
                        <span aria-hidden="true">→</span>
                    </button>
                </div>
            </main>
            
            <!-- SYSTEM NAVIGATION FOOTERBAR -->
            <nav class="app_nav">
                <a href="home.html" class="nav_item">
                    <span class="nav_icon">
                        <img src="assets/home_icon.jpeg" alt="home img" class="icon">
                    </span>
                    <span>Home</span>
                </a>
                <a href="announcement.html" class="nav_item">
                    <span class="nav_icon">
                        <img src="assets/announcement_gray.jpeg" alt="ann img" class="icon">
                    </span>
                    <span>Announcement</span>
                </a>
                <a href="tracking_reports.html" class="nav_item">
                    <span class="nav_icon">
                        <img
                            src="assets/real-time-tracking_gray.jpeg"
                            alt="ann img"
                            id="center_nav_icon"
                            class="icon"
                        >
                    </span>
                    <span>Track Reports</span>
                </a>
                <a href="profile.html" class="nav_item active">
                    <span class="nav_icon">
                        <img src="assets/account.png" alt="helpline img" class="icon">
                    </span>
                    <span>Account</span>
                </a>
            </nav>
        </div>
        <script src="offline.js" defer></script>
    <script type="module" src="../firebase/resident-session.js"></script>
<script type="module" src="../firebase/notifications-ui.js"></script>
</body>
</html>
