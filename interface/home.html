<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Municipal Gov - Home</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="desktop.css">
        <link rel="manifest" href="manifest.webmanifest">
        <meta name="theme-color" content="#1f3d5b">
    <link rel="stylesheet" href="../interface/notifications.css">
</head>
    <body>
        <style>.app_container[hidden], #sessionStatus[hidden] { display: none !important; }</style>
        <div id="sessionStatus" role="status" aria-live="polite" hidden>
            <p id="sessionMessage"></p>
            <button id="sessionRetry" type="button" disabled>Retry</button>
        </div>
        <noscript>JavaScript is required to verify your account.</noscript>
        <div class="app_container" hidden>
            <!-- APP HEADER -->
            <header class="app_header">
                <div class="app_logo_placeholder"><img src="assets/app-192.png" alt="" class="brand_icon"></div>
                <div class="header_title_block">
                    <h1>Odiongan Municipal Reporting</h1>
                    <p>Odiongan, Romblon</p>
                </div>
            </header>



            <main class="main_content">

                <!-- Announcement Section - nag lalaman ng 5 announcement na naka loop-->
                <section class="announcement_section">
                    <h3 class="section_heading">Announcement</h3>
                    <br>
                    <div class="card_slider_wrapper">
                        <div class="card_slider"></div>
                    </div>
                    <div class="status_notice">
                        <p id="announcementFeedback" role="status">Loading announcements…</p>
                        <button id="announcementRetry" type="button" hidden>Retry</button>
                    </div>
                </section>


                <!-- Reports Section - mga recent reports ng user-->
                <section class="reports_section">
                    <div class="reports_section_header">
                        <h3 class="section_heading_r">Recent reports</h3>
                        <a href="tracking_reports.html" class="reports_view_link">See all reports <span aria-hidden="true">→</span></a>
                    </div>
                    <p id="homeReportsNote" hidden>Showing your 5 most recent reports</p>
                    <ul id="homeReports" aria-label="Your recent reports"></ul>
                    <div class="status_notice">
                        <p id="homeReportsFeedback" role="status" aria-live="polite">Loading your reports…</p>
                        <button id="homeReportsRetry" type="button" hidden>Retry</button>
                    </div>
                </section>
            </main>

            
            <nav class="app_nav">
                <a href="home.html" class="nav_item active">
                    <span class="nav_icon">
                        <img src="assets/home_icon.png" alt="home img" class="icon">
                    </span>
                    <span>Home</span>
                </a>
                <a href="announcement.html" class="nav_item">
                    <span class="nav_icon">
                        <img src="assets/announcement_gray.jpeg" alt="ann img" class="icon">
                    </span>
                    <span>Announcement</span>
                </a>
                <a href="tracking_reports.html" class="nav_item">
                    <span class="nav_icon">
                        <img
                            src="assets/real-time-tracking_gray.jpeg"
                            id="center_nav_icon"
                            alt="track img"
                            class="icon"
                        >
                    </span>
                    <span>Track Reports</span>
                </a>
                <a href="hotlines.html" class="nav_item">
                    <span class="nav_icon">
                        <img src="assets/helpline_gray.jpeg" alt="helpline img" class="icon">
                    </span>
                    <span>Hotline</span>
                </a>
                <a href="profile.html" class="nav_item">
                    <span class="nav_icon">
                        <img src="assets/account_gray.jpeg" alt="helpline img" class="icon">
                    </span>
                    <span>Account</span>
                </a>
            </nav>
        </div>
        <script type="module" src="announcements.js"></script>
        <script type="module" src="home-reports.js"></script>
        <script src="offline.js" defer></script>
        
    <script type="module" src="../firebase/resident-session.js"></script>
<script type="module" src="../firebase/notifications-ui.js"></script>
</body>
</html>
