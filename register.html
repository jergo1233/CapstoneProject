<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
    <link rel="stylesheet" href="register/register.css">
    <link rel="icon" type="image/svg+xml" href="interface/assets/project-icon.svg">
</head>
<body>

<div class="register_card">
    <img class="logo_box project_logo" src="interface/assets/project-icon.svg" alt="Odiongan reporting logo">
    <p class="system_title">Odiongan Municipal Reporting</p>
    <p class="subtitle">Create Account</p> 

    <form id="registerForm"> 
<div class="input_group">
            <input type="text" id="fullName" name="fullName" placeholder="Full Name" required>
        </div>

        <div class="input_group">
            <input type="email" id="email" name="email" placeholder="Email@gmail.com" required>
        </div>

        <div class="input_group">
            <input type="password" id="password" class="password_input" placeholder="Password" required>
            <button
                type="button" class="toggle_password" id="togglePassword">
                <img src="register/assets_reg/hides.png" id="eyeIcon" alt="Toggle Password">
            </button>
        </div>

        <div class="input_group">
            <input type="password" id="confirmPassword" name="confirmPassword" class="password_input" placeholder="Confirm Password" required>
        <button type="button" class="toggle_password" id="toggleConfirmPassword"> <img src="register/assets_reg/hides.png" id="confirmEyeIcon" alt="Toggle Password">
        </button>
</div>                                                              

<div class="input_group">
        <input list="barangay" id="barangayInput" name="barangayInput" placeholder="Select your barangay" required>
        <datalist id = "barangay">
         <option value="Amatong">Amatong</option>
         <option value="Anahao">Anahao</option>
         <option value="Bangon">Bangon</option>
         <option value="Batiano">Batiano</option>
         <option value="Budiong">Budiong</option>
         <option value="Canduyong">Canduyong</option>
         <option value="Dapawan">Dapawan</option>
         <option value="Gabawan">Gabawan</option>
         <option value="Libertad">Libertad</option>
         <option value="Ligaya">Ligaya</option>
         <option value="Liwanag">Liwanag</option>
         <option value="Liwayway">Liwayway</option>
         <option value="Malilico">Malilico</option>
         <option value="Mayha">Mayha</option>
         <option value="Panique">Panique</option>
         <option value="Pato-o">Pato-o</option>
         <option value="Poctoy">Poctoy</option>
         <option value="Progreso Este">Progreso Este</option>
         <option value="Progreso Weste">Progreso Weste</option>
         <option value="Rizal">Rizal</option>
         <option value="Tabing Dagat">Tabing Dagat</option>
         <option value="Tabobo-an">Tabobo-an</option>
         <option value="Tuburan">Tuburan</option>
         <option value="Tumingad">Tumingad</option>
         <option value="Tulay">Tulay</option>
        </datalist>
</div>

        <button type="submit" class="signin_btn">Create account</button>
    </form>
<p id="registerFeedback" role="alert" hidden></p>

    <div class="footer_text">Already have an account? <a href="index.html">Sign In</a></div>
</div>


<script type="module" src="register/register.js"></script>
</body>
</html>
